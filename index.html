<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MARAIS | Considered Essentials</title>

      name="description"
      content="MARAIS makes considered wardrobe essentials in natural fabrics, produced in small batches and built to outlast the season."

    <!-- Fonts load in the browser, never during the build, so a slow or
         filtered network can never stall the dev server. The CSS stack in
         index.css falls back to system fonts if these never arrive. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>

  </body>
</html>
